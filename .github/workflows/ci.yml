name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Start isolated application stack
        run: |
          docker compose \
            --project-name launchpad-ci \
            --env-file .env.example \
            -f compose.yaml \
            -f compose.test.yaml \
            up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:18080/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --project-name launchpad-ci --env-file .env.example -f compose.yaml -f compose.test.yaml ps
          exit 1
      - name: Run backend tests
        env:
          LAUNCHPAD_TEST_URL: http://localhost:18080
          PUBLIC_BASE_URL: http://localhost:18080
        run: python -m pytest -q backend/tests
      - name: Show service logs after a failure
        if: failure()
        run: docker compose --project-name launchpad-ci --env-file .env.example -f compose.yaml -f compose.test.yaml logs --no-color --tail=200
      - name: Stop isolated application stack
        if: always()
        run: docker compose --project-name launchpad-ci --env-file .env.example -f compose.yaml -f compose.test.yaml down --volumes --remove-orphans

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        run: yarn test --watchAll=false --runInBand
      - name: Test structured job-page extraction
        run: node scripts/test-extension-jobposting.js
      - name: Build frontend
        working-directory: frontend
        run: yarn build

  extension:
    name: Extension validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check extension JavaScript
        run: node --check extension/popup.js
      - name: Validate manifest, DOM IDs, and downloadable archive
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
          if (manifest.version !== '1.8.2') throw new Error(`Unexpected extension version: ${manifest.version}`);
          const html = fs.readFileSync('extension/popup.html', 'utf8');
          const js = fs.readFileSync('extension/popup.js', 'utf8');
          const ids = new Set([...html.matchAll(/\bid=["']([^"']+)["']/g)].map((match) => match[1]));
          const referenced = [
            ...[...js.matchAll(/getElementById\(["']([^"']+)["']\)/g)].map((match) => match[1]),
            ...[...js.matchAll(/\$\(["']([^"']+)["']\)/g)].map((match) => match[1]),
          ];
          if (!referenced.length) throw new Error('No extension DOM references were found');
          const missing = [...new Set(referenced.filter((id) => !ids.has(id)))];
          if (missing.length) throw new Error(`Missing extension element IDs: ${missing.join(', ')}`);
          NODE
          test -f frontend/public/launchpad-extension.zip
          unzip -t frontend/public/launchpad-extension.zip
          unzip -p frontend/public/launchpad-extension.zip extension/manifest.json | grep -q '"version": "1.8.2"'
