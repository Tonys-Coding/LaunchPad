<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Launchpad job and internship application tracker" />
    <script>
      try {
        var savedTheme = localStorage.getItem("theme-preference") || localStorage.getItem("theme") || "dark";
        var resolvedTheme = savedTheme === "system"
          ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : savedTheme;
        document.documentElement.classList.toggle("light", resolvedTheme === "light");
        document.documentElement.style.colorScheme = resolvedTheme;
      } catch (_) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
    <title>Launchpad — Job &amp; Internship Tracker</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
