# Isolated local verification. Never include this override in a deployment.
# Run with --project-name launchpad-test and .env.example only.
services:
  backend:
    image: launchpad-production-backend:latest
    environment:
      PRODUCTION_MODE: "false"
      SIGNUP_MODE: open
      RATE_LIMITING_ENABLED: "false"
      COOKIE_SECURE: "false"
      PUBLIC_BASE_URL: http://localhost:${LAUNCHPAD_TEST_PORT:-18080}
      CORS_ORIGINS: http://localhost:${LAUNCHPAD_TEST_PORT:-18080}
      TRUSTED_HOSTS: localhost,backend
      GOOGLE_CLIENT_ID: launchpad-test-client
      GOOGLE_CLIENT_SECRET: launchpad-test-secret
      GOOGLE_CALENDAR_TOKEN_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      GEMINI_API_KEY: ""
      CHROME_EXTENSION_IDS: abcdefghijklmnopabcdefghijklmnop
  web:
    image: launchpad-production-web:latest
    ports: !override
      - "127.0.0.1:${LAUNCHPAD_TEST_PORT:-18080}:80"
    volumes: !override
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
