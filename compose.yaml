name: launchpad

services:
  mongo:
    image: launchpad-mongo-production:latest
    build:
      context: .
      dockerfile: docker/mongo/Dockerfile
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--replSet", "launchpad"]
    environment:
      MONGO_REPLICA_SET_NAME: launchpad
      MONGO_REPLICA_SET_HOST: mongo:27017
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "launchpad-mongo-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-launchpad}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-launchpad-local-secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=launchpad
      DB_NAME: ${MONGO_DATABASE:-launchpad}
      CORS_ORIGINS: http://localhost:${LAUNCHPAD_PORT:-8080}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      SESSION_DAYS: ${SESSION_DAYS:-30}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${LAUNCHPAD_PORT:-8080}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_TOKEN_KEY: ${GOOGLE_CALENDAR_TOKEN_KEY:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-launchpad}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-launchpad-local-secret}
      S3_BUCKET: ${S3_BUCKET:-launchpad}
      S3_REGION: us-east-1
      STORAGE_REQUIRED: "true"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_FLYER_BYTES: ${MAX_FLYER_BYTES:-8388608}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_FLYER_DAILY_LIMIT: ${AI_FLYER_DAILY_LIMIT:-20}
      ALLOW_ALL_CHROME_EXTENSIONS: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LAUNCHPAD_PORT:-8080}:80"

volumes:
  mongo_data:
  minio_data:
